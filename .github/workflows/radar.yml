name: EV Radar Automatyzacja
on:
  schedule:
    - cron: '0 5 * * *' # Codziennie o 05:00 rano UTC
  workflow_dispatch: # Przycisk do ręcznego uruchamiania
permissions:
  contents: write
jobs:
  aktualizuj-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Uruchomienie AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_radar.py
      - name: Publikacja na stronie
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Aktualizacja raportu EV Radar" || exit 0
          git push
